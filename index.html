<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';">
  <title>LogoScreen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    .logo-image {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      display: none;
    }

    .logo-image.visible {
      display: block;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #666;
      text-align: center;
      padding: 20px;
    }

    .placeholder.hidden {
      display: none;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .placeholder h2 {
      font-size: 24px;
      margin-bottom: 10px;
      font-weight: 300;
    }

    .placeholder p {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 5px;
    }

    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .container:hover .controls,
    .controls:focus-within {
      opacity: 1;
    }

    .controls.always-visible {
      opacity: 1;
    }

    .btn {
      padding: 10px 20px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #333;
      color: #fff;
    }

    .btn:hover {
      background-color: #444;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background-color: #0066cc;
    }

    .btn-primary:hover {
      background-color: #0077ee;
    }

    .btn-danger {
      background-color: #cc3333;
    }

    .btn-danger:hover {
      background-color: #dd4444;
    }

    .status-bar {
      position: fixed;
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      background-color: rgba(0, 0, 0, 0.7);
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .container:hover .status-bar {
      opacity: 1;
    }

    .kiosk-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      background-color: #666;
    }

    .kiosk-indicator.active {
      background-color: #00cc66;
    }

    .shortcuts-help {
      position: fixed;
      top: 10px;
      left: 10px;
      padding: 10px;
      background-color: rgba(0, 0, 0, 0.8);
      color: #888;
      border-radius: 4px;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .container:hover .shortcuts-help {
      opacity: 1;
    }

    .shortcuts-help kbd {
      display: inline-block;
      padding: 2px 6px;
      background-color: #333;
      border-radius: 3px;
      margin-right: 5px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img id="logoImage" class="logo-image" alt="Logo">
      <div id="placeholder" class="placeholder">
        <div class="placeholder-icon">🖼️</div>
        <h2>No Logo Uploaded</h2>
        <p>Press <kbd>Ctrl+O</kbd> or click the button below to upload a logo</p>
        <p>Supported formats: PNG, JPG, GIF, BMP, WebP</p>
      </div>
    </div>

    <div class="status-bar">
      <span id="kioskIndicator" class="kiosk-indicator"></span>
      <span id="kioskStatus">Normal Mode</span>
    </div>

    <div class="shortcuts-help">
      <div><kbd>F11</kbd> Toggle Kiosk Mode</div>
      <div><kbd>Esc</kbd> Exit Kiosk Mode</div>
      <div><kbd>Ctrl+O</kbd> Upload Logo</div>
      <div><kbd>Ctrl+Shift+K</kbd> Toggle Kiosk</div>
    </div>

    <div class="controls" id="controls">
      <button class="btn btn-primary" id="uploadBtn">📁 Upload Logo</button>
      <button class="btn" id="kioskBtn">🖥️ Enter Kiosk Mode</button>
      <button class="btn btn-danger" id="clearBtn">🗑️ Clear Logo</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
